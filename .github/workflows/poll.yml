name: poll
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brew-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Poll device (getstatus, fs, hourly tschedule)
        env:
          BREW_BASE: ${{ secrets.BREW_BASE }}
          PB_TOKEN: ${{ secrets.PB_TOKEN }}
        run: |
          echo "::add-mask::$BREW_BASE"
          echo "::add-mask::$PB_TOKEN"
          python3 scripts/poll.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
